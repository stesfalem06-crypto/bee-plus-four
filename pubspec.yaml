name: high
description: "High – offline Grade 9-12 notes and Eritrean matriculation / model exam prep. Native Flutter (no WebView)."
publish_to: 'none'
version: 1.0.6+8

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  vector_graphics: ^1.1.19
  flutter_math_fork: ^0.7.4
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  crypto: ^3.0.6
  pdfrx: ^2.6.5
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  four_format:
    path: packages/four_format

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    # Study content is bundled ONLY encrypted (4 1.0.4+): tool/encrypt_assets.py turns every file listed in
    # tool/content_assets.txt into assets/c/<blob>; lib/content/content_vault.dart decrypts on load.
    # Never add assets/high/<content> folders here again (that would put the plain files back into the APK).
    - assets/c/
    - assets/high/howto/
  fonts:
    - family: HighNunito
      fonts:
        - asset: assets/high/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/high/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/high/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/high/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/high/fonts/Nunito-900.ttf
          weight: 900
        - asset: assets/high/fonts/Nunito-Italic-700.ttf
          weight: 700
          style: italic
    - family: HighSymbols
      fonts:
        - asset: assets/high/fonts/HighSymbols-Noto.ttf
    - family: HighSymbols2
      fonts:
        - asset: assets/high/fonts/HighSymbols-DejaVu.ttf
    - family: HighSymbols3
      fonts:
        - asset: assets/high/fonts/HighSymbols-Math.ttf
    - family: HighGeez
      fonts:
        - asset: assets/high/fonts/NotoSansEthiopic-700.ttf
          weight: 700
