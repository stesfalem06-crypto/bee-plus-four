name: high
description: "High – offline Grade 9-12 notes and Eritrean matriculation / model exam prep. Native Flutter (no WebView)."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.8.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  vector_graphics: ^1.1.19
  flutter_math_fork: ^0.7.4
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  crypto: ^3.0.6
  pdfrx: ^2.6.5
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  four_format:
    path: packages/four_format

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/high/exams/
    - assets/high/exams/matric_lazy/
    - assets/high/exams/matric_lazy/subjects/
    - assets/high/exams/media/
    - assets/high/exercises/
    - assets/high/exercises/school/
    - assets/high/exercises/drive_chapters/
    - assets/high/exercises/drive_meta/
    - assets/high/codes.json
    - assets/high/motivation/
    - assets/high/coach/
    - assets/high/tutor/
    - assets/high/howto/
    - assets/high/media/
    - assets/high/media/img/
    - assets/high/media/models/
    - assets/high/notes/
    - assets/high/notes/notes/
    - assets/high/notes/split/
    - assets/high/notes/notes/svg/agriculture_11/
    - assets/high/notes/notes/svg/agriculture_12/
    - assets/high/notes/notes/svg/agri_11/
    - assets/high/notes/notes/svg/agri_12/
    - assets/high/notes/notes/svg/biology_10/
    - assets/high/notes/notes/svg/biology_11/
    - assets/high/notes/notes/svg/biology_12/
    - assets/high/notes/notes/svg/biology_9/
    - assets/high/notes/notes/svg/business_economics_10/
    - assets/high/notes/notes/svg/business_economics_11/
    - assets/high/notes/notes/svg/business_economics_12/
    - assets/high/notes/notes/svg/chemistry_10/
    - assets/high/notes/notes/svg/chemistry_11/
    - assets/high/notes/notes/svg/chemistry_12/
    - assets/high/notes/notes/svg/chemistry_9/
    - assets/high/notes/notes/svg/geography_10/
    - assets/high/notes/notes/svg/geography_11/
    - assets/high/notes/notes/svg/geography_12/
    - assets/high/notes/notes/svg/geography_9/
    - assets/high/notes/notes/svg/history_12/
    - assets/high/notes/notes/svg/mathematics_9/
    - assets/high/notes/notes/svg/mathematics_10/
    - assets/high/notes/notes/svg/mathematics_11/
    - assets/high/notes/notes/svg/mathematics_12/
    - assets/high/notes/notes/svg/physics_10/
    - assets/high/notes/notes/svg/physics_11/
    - assets/high/notes/notes/svg/physics_12/
    - assets/high/notes/notes/svg/physics_9/
  fonts:
    - family: HighNunito
      fonts:
        - asset: assets/high/fonts/Nunito-500.ttf
          weight: 500
        - asset: assets/high/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/high/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/high/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/high/fonts/Nunito-900.ttf
          weight: 900
        - asset: assets/high/fonts/Nunito-Italic-700.ttf
          weight: 700
          style: italic
    - family: HighSymbols
      fonts:
        - asset: assets/high/fonts/HighSymbols-Noto.ttf
    - family: HighSymbols2
      fonts:
        - asset: assets/high/fonts/HighSymbols-DejaVu.ttf
    - family: HighSymbols3
      fonts:
        - asset: assets/high/fonts/HighSymbols-Math.ttf
    - family: HighGeez
      fonts:
        - asset: assets/high/fonts/NotoSansEthiopic-700.ttf
          weight: 700
